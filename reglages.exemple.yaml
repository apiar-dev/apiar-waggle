# Les réglages de waggle sur une machine, à copier dans ~/.config/waggle/reglages.yaml. Ce fichier n'est pas committé :
# il décrit cette machine-ci (README, « Les réglages »).

instances:

  # UN POSTE : une instance sur la boucle locale, qui lit tous les projets.
  poste:
    adresse: 127.0.0.1
    # Les ports historiques d'un projet existant, en plus de 80 et 443 ; un nouveau projet n'en demande aucun.
    # ports: [3000, 3001]
    # Le relais vers le waggle d'un serveur, par le VPN : ce que ce poste ne sert pas, il le lui passe.
    # relais:
    #   - vers: 10.8.0.1                  # l'adresse WireGuard du serveur
    #     domaines:
    #       - https://dev.exemple.fr      # un domaine que waggle termine
    #       - tls://dev.ancien.fr         # un domaine en passage
    #       - http://localhost            # les noms en .localhost

  # UN SERVEUR : une instance par VPN, sur son adresse WireGuard. L'interface s'en déduit, et la règle de pare-feu avec.
  # equipe:
  #   adresse: 10.8.0.1
  #   projets: [mon-projet]               # avec plusieurs instances, chacune nomme ses projets
  #   dns: [dev.exemple.fr]               # le DNS du VPN, pour les téléphones
  # clients:
  #   adresse: 10.9.0.1
  #   projets: [un-autre-projet]
