# waggle's configuration on one machine, to copy to ~/.config/waggle/config.yaml. That copy is not committed: it describes
# this machine (see the README).

instances:

  # A WORKSTATION: one instance on loopback, which serves every project.
  workstation:
    address: 127.0.0.1
    # Legacy ports of an existing project, on top of 80 and 443; a new project needs none.
    # ports: [3000, 3001]
    # Relay to a server's waggle, through the VPN: what this workstation does not serve, it passes on.
    # relays:
    #   - to: 10.8.0.1                  # the server's WireGuard address
    #     domains:
    #       - https://dev.example.com   # a domain waggle terminates
    #       - tls://dev.legacy.com      # a passthrough domain
    #       - http://localhost          # .localhost names

  # A SERVER: one instance per VPN, on its WireGuard address. The interface is deduced from it, and the firewall rule too.
  # team:
  #   address: 10.8.0.1
  #   projects: [my-project]            # with several instances, each one lists its projects
  #   dns: [dev.example.com]            # the VPN DNS, for phones
  # clients:
  #   address: 10.9.0.1
  #   projects: [another-project]
